name: Full MATLAB Regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-matlab-regression:
    name: Complete 640-injection study regression
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check out project-one baseline reference
        uses: actions/checkout@v4
        with:
          repository: Henry-Don/grid-connected-bess-control-validation
          ref: v0.5.1
          path: reference-project
      - name: Set up MATLAB products
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: >-
            Simulink
            Simscape
            Simscape_Electrical
      - name: Run all seven validation groups
        uses: matlab-actions/run-command@v2
        env:
          BESS_REFERENCE_PROJECT_ROOT: ${{ github.workspace }}\reference-project
        with:
          command: run(fullfile(pwd,"tests","run_all_checks.m"))
      - name: Upload complete regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-evidence
          path: |
            results/*.mat
            results/*.png
          if-no-files-found: warn
          retention-days: 14
