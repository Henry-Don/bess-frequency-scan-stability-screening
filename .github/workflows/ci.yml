name: Project Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-evidence:
    name: Repository evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate publication structure
        run: python python/verify_repository.py

  matlab-regression:
    name: MATLAB and Simulink regression
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check out project-one baseline reference
        uses: actions/checkout@v4
        with:
          repository: Henry-Don/grid-connected-bess-control-validation
          ref: v0.5.1
          path: reference-project
      - name: Set up MATLAB products
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024b
          products: >-
            Simulink
            Simscape
            Simscape_Electrical
      - name: Run complete regression
        uses: matlab-actions/run-command@v2
        env:
          BESS_REFERENCE_PROJECT_ROOT: ${{ github.workspace }}\reference-project
        with:
          command: run(fullfile(pwd,"tests","run_all_checks.m"))
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-evidence
          path: |
            results/*.mat
            results/*.png
          if-no-files-found: warn
          retention-days: 14
