<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="title desc">
  <title id="title">Grid-connected BESS frequency-scan architecture</title>
  <desc id="desc">Power stage, grid-following control, perturbation interface and automated screening workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f7fafc"/><stop offset="1" stop-color="#e8f2f7"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#0d4f83"/><stop offset="1" stop-color="#1780b8"/></linearGradient>
    <linearGradient id="teal" x1="0" x2="1"><stop stop-color="#087c7c"/><stop offset="1" stop-color="#16a0a0"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#34536f"/></marker>
    <style>
      .title{font:700 30px 'Segoe UI',Arial;fill:#10243e}.lane{font:700 18px 'Segoe UI',Arial;fill:#50657a;letter-spacing:1px}.box{rx:16;stroke:#b8c9d8;stroke-width:2;fill:#fff}.boxt{font:700 19px 'Segoe UI',Arial;fill:#17324d}.sub{font:15px 'Segoe UI',Arial;fill:#5d6e7e}.arrow{stroke:#34536f;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#5c809e;stroke-width:2.5;stroke-dasharray:9 7;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="610" rx="22" fill="url(#bg)"/>
  <text x="52" y="54" class="title">Black-box dq frequency scan and weak-grid risk screening</text>
  <text x="54" y="112" class="lane">POWER STAGE</text>
  <rect class="box" x="55" y="140" width="180" height="100"/><text class="boxt" x="145" y="181" text-anchor="middle">11 kV Grid</text><text class="sub" x="145" y="209" text-anchor="middle">SCR-controlled Zg</text>
  <rect class="box" x="290" y="140" width="180" height="100"/><text class="boxt" x="380" y="181" text-anchor="middle">PCC + LCL</text><text class="sub" x="380" y="209" text-anchor="middle">Vdq / Idq sensing</text>
  <rect class="box" x="525" y="140" width="180" height="100"/><text class="boxt" x="615" y="181" text-anchor="middle">VSC</text><text class="sub" x="615" y="209" text-anchor="middle">Average converter</text>
  <rect class="box" x="760" y="140" width="180" height="100"/><text class="boxt" x="850" y="181" text-anchor="middle">DC Link</text><text class="sub" x="850" y="209" text-anchor="middle">Capacitor + Vdc</text>
  <rect class="box" x="995" y="140" width="180" height="100"/><text class="boxt" x="1085" y="181" text-anchor="middle">DC/DC</text><text class="sub" x="1085" y="209" text-anchor="middle">Bidirectional control</text>
  <rect class="box" x="1230" y="140" width="125" height="100"/><text class="boxt" x="1292" y="181" text-anchor="middle">Battery</text><text class="sub" x="1292" y="209" text-anchor="middle">RC + SoC</text>
  <path class="arrow" d="M235 190 H285"/><path class="arrow" d="M470 190 H520"/><path class="arrow" d="M705 190 H755"/><path class="arrow" d="M940 190 H990"/><path class="arrow" d="M1175 190 H1225"/>

  <text x="54" y="310" class="lane">CONTROL AND IDENTIFICATION</text>
  <rect x="55" y="340" width="255" height="120" rx="16" fill="url(#blue)"/><text x="182" y="382" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="white">Perturbation interface</text><text x="182" y="413" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#ddecf8">d-axis / q-axis sinusoid</text><text x="182" y="438" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#ddecf8">frequency + amplitude</text>
  <rect class="box" x="365" y="340" width="240" height="120"/><text class="boxt" x="485" y="381" text-anchor="middle">GFL Controller</text><text class="sub" x="485" y="412" text-anchor="middle">PLL, abc/dq, current loops</text><text class="sub" x="485" y="438" text-anchor="middle">P/Q and Vdc regulation</text>
  <rect class="box" x="660" y="340" width="230" height="120"/><text class="boxt" x="775" y="381" text-anchor="middle">Tone Extraction</text><text class="sub" x="775" y="412" text-anchor="middle">complex Vdq / Idq</text><text class="sub" x="775" y="438" text-anchor="middle">fit-quality gates</text>
  <rect class="box" x="945" y="340" width="190" height="120"/><text class="boxt" x="1040" y="381" text-anchor="middle">Ydq Matrix</text><text class="sub" x="1040" y="412" text-anchor="middle">Ydd Ydq</text><text class="sub" x="1040" y="438" text-anchor="middle">Yqd Yqq</text>
  <rect x="1190" y="340" width="165" height="120" rx="16" fill="url(#teal)"/><text x="1272" y="381" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="white">Risk Screen</text><text x="1272" y="412" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#e1ffff">Zg x Ybess</text><text x="1272" y="438" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#e1ffff">score + frequency</text>
  <path class="dash" d="M310 400 H360"/><path class="dash" d="M605 400 H655"/><path class="arrow" d="M890 400 H940"/><path class="arrow" d="M1135 400 H1185"/>
  <path class="dash" d="M182 338 C182 285 380 300 380 245"/><path class="dash" d="M485 338 C485 290 615 300 615 245"/><path class="dash" d="M775 338 C775 285 380 300 380 245"/>

  <rect x="55" y="510" width="1300" height="62" rx="14" fill="#10243e"/>
  <text x="705" y="550" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="600" fill="white">4 SCR values x 4 PLL scales x 20 frequencies x 2 injection axes = 640 represented runs</text>
</svg>
